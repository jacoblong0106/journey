<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>花蓮三天兩夜</title>
<style>
:root{--bg:#eef5f4;--card:#fff;--ink:#12343b;--sub:#5d7a80;--sea:#1d6b7a;--sun:#f0b43c;--line:#cfe0de;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1e;--card:#162a2f;--ink:#e6f1f0;--sub:#8fb0b5;--sea:#6cc3d1;--line:#27424a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1b1e;--card:#162a2f;--ink:#e6f1f0;--sub:#8fb0b5;--sea:#6cc3d1;--line:#27424a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.hero{line-height:0;border-radius:0 0 28px 28px;overflow:hidden}
.hero img{display:block;width:100%;height:auto}
.cd{margin:-36px 18px 0;position:relative;background:var(--card);border-radius:24px;padding:18px 12px;text-align:center;box-shadow:0 8px 24px rgba(18,52,59,.18)}
.cd small{display:block;color:var(--sub);font-size:14px}
.cd b{display:block;margin-top:4px;font-size:26px;color:var(--sea);font-variant-numeric:tabular-nums}
.cd b i{font-style:normal;color:#e8832a}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:16px 16px 0}
.chips span{background:var(--card);border:1px solid var(--line);padding:5px 13px;border-radius:99px;font-size:14px}
nav{display:flex;gap:8px;padding:14px 16px 8px;overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 18px;border-radius:99px;font:inherit;font-size:15px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--sea);color:#fff;border-color:var(--sea)}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
main{padding:6px 16px 40px;max-width:560px;margin:0 auto}
h2{font-size:18px;margin:14px 4px 12px}
.day{display:block;width:100%;text-align:left;border:0;background:var(--card);color:var(--ink);font:inherit;border-radius:18px;padding:14px 16px;margin-bottom:12px;cursor:pointer;border-left:5px solid var(--sun)}
.day b{display:block;font-size:17px}.day span{display:block;font-size:14px;color:var(--sub);margin-top:4px}
ol{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
li{position:relative;margin:0 0 12px;padding:12px 14px;background:var(--card);border-radius:14px}
li::before{content:"";position:absolute;left:-26px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--sun);border:2px solid var(--bg)}
.t{display:block;font-size:13px;color:var(--sea);font-weight:700}
.n{display:block;margin-top:2px;line-height:1.4}
.x{display:block;font-size:13px;color:var(--sub)}
a.m{display:inline-block;margin-top:6px;font-size:13px;color:var(--sea);text-decoration:none;border-bottom:1px solid var(--line)}
.tip{background:var(--card);border-left:4px solid var(--sun);padding:10px 14px;border-radius:10px;font-size:14px;color:var(--sub);margin:0 0 14px}
footer{text-align:center;color:var(--sub);font-size:13px;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
</style>
</head>
