<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>花蓮三天兩夜（11/18 updated）</title>
<style>
:root{--bg:#67568c;--card:#fff;--ink:#1f1235;--sub:#67568c;--sea:#67568c;--sun:#fbdd74;--line:#e4def0;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.hero{line-height:0;border-radius:0 0 28px 28px;overflow:hidden}
.hero img{display:block;width:100%;height:auto}
.cd{margin:-36px 18px 0;position:relative;background:var(--card);border-radius:24px;padding:18px 12px;text-align:center;box-shadow:0 8px 24px rgba(18,52,59,.18)}
.cd small{display:block;color:var(--sub);font-size:14px}
.cd b{display:block;margin-top:4px;font-size:26px;color:var(--sea);font-variant-numeric:tabular-nums}
.cd b i{font-style:normal;color:#e8832a}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:16px 16px 0}
.chips span{background:var(--card);border:1px solid var(--line);padding:5px 13px;border-radius:99px;font-size:14px}
nav{display:flex;gap:8px;padding:14px 16px 8px;overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 18px;border-radius:99px;font:inherit;font-size:15px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--sea);color:#fff;border-color:var(--sea)}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
main{padding:6px 16px 40px;max-width:560px;margin:0 auto}
h2{font-size:18px;margin:14px 4px 12px}
.day{display:block;width:100%;text-align:left;border:0;background:var(--card);color:var(--ink);font:inherit;border-radius:18px;padding:14px 16px;margin-bottom:12px;cursor:pointer;border-left:5px solid var(--sun)}
.day b{display:block;font-size:17px}.day span{display:block;font-size:14px;color:var(--sub);margin-top:4px}
ol{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
li{position:relative;margin:0 0 12px;padding:12px 14px;background:var(--card);border-radius:14px}
li::before{content:"";position:absolute;left:-26px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--sun);border:2px solid var(--bg)}
.t{display:block;font-size:13px;color:var(--sea);font-weight:700}
.n{display:block;margin-top:2px;line-height:1.4}
.x{display:block;font-size:13px;color:var(--sub)}
a.m{display:inline-block;margin-top:6px;font-size:13px;color:var(--sea);text-decoration:none;border-bottom:1px solid var(--line)}
.tip{background:var(--card);border-left:4px solid var(--sun);padding:10px 14px;border-radius:10px;font-size:14px;color:var(--sub);margin:0 0 14px}
footer{text-align:center;color:var(--sub);font-size:13px;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.grp{margin:4px 0 16px}.grp h3{font-size:15px;margin:0 4px 8px}.grp h3 small{color:var(--sub);font-weight:400;font-size:12px}
.sl{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 10px;-webkit-overflow-scrolling:touch}
.cd2{flex:0 0 78%;scroll-snap-align:center;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(18,52,59,.14)}
.ph{height:150px;display:flex;align-items:center;justify-content:center;font-size:48px;background:linear-gradient(135deg,#9fd3dc,#f6d9a0)}
.ph img{width:100%;height:100%;object-fit:cover}
.cb{padding:12px 14px 14px}.cb b{font-size:16px;display:block}.cb .t{display:inline}
.tg{display:inline-block;font-size:12px;background:var(--bg);color:var(--sea);padding:1px 10px;border-radius:99px;margin-top:4px}
.cb p{margin:6px 0 0;font-size:14px;color:var(--sub)}
.lp{display:block;width:100%;height:220px;object-fit:cover;object-position:50% 25%;border-radius:12px;margin-top:8px}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes tk{from{transform:scale(1.35);opacity:.4}}
@keyframes fl{50%{transform:translateY(-5px)}}
.hero img{animation:kb 14s ease-out both}
.cd{animation:up .9s .25s cubic-bezier(.2,.7,.2,1) both}
.cd b i{display:inline-block;animation:tk .5s}
.chips span{animation:up .7s both}.chips span:nth-child(1){animation-delay:.45s}.chips span:nth-child(2){animation-delay:.55s}.chips span:nth-child(3){animation-delay:.65s}
nav{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent)}
nav button{transition:background .3s,color .3s,transform .2s}nav button:active{transform:scale(.94)}
.day,.cd2,a.btn{transition:transform .25s,box-shadow .25s}
.day:hover,.cd2:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(18,52,59,.18)}.day:active{transform:scale(.985)}
.ph img,.lp{transition:transform .8s}.cd2:hover .ph img{transform:scale(1.06)}
.rv{opacity:0;transform:translateY(16px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.wx{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(18,52,59,.10)}
.wi{font-size:44px;text-align:center;animation:fl 4s ease-in-out infinite}
.wd b{display:block;font-size:16px}.wd span{font-size:13px;color:var(--sub)}
.wt{font-size:28px;font-weight:700;color:var(--sea);white-space:nowrap}.wt small{font-size:15px;color:var(--sub);font-weight:400}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sun);border-radius:9px;transition:width 1.2s .3s cubic-bezier(.2,.7,.2,1)}
.wx.in .bar i,.wx:not(.rv) .bar i{width:var(--w)}
.stay{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 6px 20px rgba(18,52,59,.14);margin-bottom:14px}
.stay .sh{height:130px;display:flex;align-items:center;justify-content:center;font-size:60px;background:linear-gradient(135deg,#9fd3dc,#f6d9a0)}
.stay .sb{padding:16px 18px 20px}.stay .sb b{font-size:18px;display:block}
.stay .r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.stay .r span:first-child{color:var(--sub)}
a.btn{display:inline-block;margin-top:14px;background:var(--sea);color:var(--bg);padding:10px 20px;border-radius:99px;text-decoration:none;font-size:14px}
a.btn:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.bar i{width:var(--w)}}
body{color:var(--ink)}
h2,footer,.grp h3{color:#fff}.grp h3 small{color:#e7e1f5}
footer a,footer{color:#e7e1f5}
.hero{border-bottom:3px solid #1f1235}
.cd,.day,.cd2,.wx,.stay,li,.tip{background:#fff;border:2px solid #1f1235;box-shadow:3px 3px 0 #1f1235}
.cd{border-radius:20px}.day{border-left:8px solid #fbdd74}.tip{border-radius:12px}
.day:hover,.cd2:hover{box-shadow:5px 5px 0 #1f1235}
.cd b{color:#1f1235}.cd b i{background:#ff6e6c;color:#1f1235;padding:0 8px;border:2px solid #1f1235;border-radius:8px}
.chips span{background:#fff;color:#1f1235;border:2px solid #1f1235;font-weight:600}
nav button{background:#fff;color:#1f1235;border:2px solid #1f1235;font-weight:600}
nav button[aria-selected="true"]{background:#ff6e6c;color:#1f1235;border-color:#1f1235;box-shadow:2px 2px 0 #1f1235}
ol{border-left-color:rgba(255,255,255,.45)}li::before{background:#fbdd74;border:2px solid #1f1235}
.t,.wt{color:#67568c}.wt small{color:#67568c}
.tg{background:#fbdd74;color:#1f1235;border:1.5px solid #1f1235}
a.m{background:#ff6e6c;color:#1f1235;padding:3px 12px;border:2px solid #1f1235;border-radius:99px;font-weight:700}
a.btn{background:#ff6e6c;color:#1f1235;border:2px solid #1f1235;font-weight:700;box-shadow:2px 2px 0 #1f1235}
.tip a.m{margin-left:6px}
.ph,.stay .sh{background:linear-gradient(135deg,#ff6e6c,#fbdd74);border-bottom:2px solid #1f1235}
.stay .sh{height:200px;padding:0}.stay .sh img{width:100%;height:100%;object-fit:cover;display:block}
.bar{height:10px;background:#ece8f5;border:1.5px solid #1f1235}.bar i{background:#ff6e6c}
.stay .r{border-bottom-color:#e4def0}
</style>
</head>
