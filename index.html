<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>花蓮三天兩夜</title>
<style>
:root{
  --bg:#eaf2f3; --card:#ffffff; --ink:#14262b; --sub:#5b7077; --line:#d3e0e3;
  --sea:#0f5b73; --field:#4f7f3f; --dusk:#b9741a; --accent:var(--sea);
  --done:#9bb0b5;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1a1e; --card:#16272d; --ink:#e6f0f2; --sub:#93aab0; --line:#27414a;
    --sea:#5cb8d4; --field:#8cc27a; --dusk:#e9aa5a; --done:#5d767d;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.6;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{padding:36px 22px 22px;max-width:640px;margin:0 auto}
h1{margin:0;font-size:2.6rem;line-height:1.1;letter-spacing:.06em;font-weight:800}
.dates{margin:10px 0 0;color:var(--sub);font-size:1rem}
nav{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:10px 16px 10px;border-bottom:1px solid var(--line)}
nav .in{display:flex;gap:8px;max-width:640px;margin:0 auto}
nav button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:8px 4px;font:inherit;font-size:.9rem;cursor:pointer;line-height:1.3}
nav button b{display:block;font-size:1rem}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){nav button[aria-selected="true"]{color:#0e1a1e}}
nav button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:18px 16px 60px}
.day{display:none}
.day.on{display:block}
.day h2{margin:4px 6px 4px;font-size:1.35rem}
.day .meta{margin:0 6px 14px;color:var(--sub);font-size:.92rem}
ol{list-style:none;margin:0;padding:0;border-left:3px solid var(--accent);margin-left:12px}
li{position:relative;margin:0 0 10px 18px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;display:flex;align-items:center;gap:6px}
li::before{content:"";position:absolute;left:-28.5px;top:50%;width:12px;height:12px;margin-top:-6px;
  border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
li label{flex:1;display:flex;align-items:center;gap:12px;padding:14px 4px 14px 14px;cursor:pointer;font-size:1.05rem}
li input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
li.done label span{color:var(--done);text-decoration:line-through}
li.done::before{background:var(--accent)}
li a{flex:none;padding:14px 16px 14px 8px;color:var(--accent);text-decoration:none;font-size:.9rem;font-weight:600}
.d1{--accent:var(--sea)} .d2{--accent:var(--field)} .d3{--accent:var(--dusk)}
footer{max-width:640px;margin:0 auto;padding:0 22px 40px;color:var(--sub);font-size:.85rem}
footer button{font:inherit;color:var(--sub);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>花蓮<br>三天兩夜</h1>
  <p class="dates">11/16（一）– 11/18（三）　主揪：瓏</p>
</header>
<nav><div class="in" role="tablist" id="tabs"></div></nav>
<main id="days"></main>
<footer>
  點景點可以打勾，進度只存在你自己的手機。<br>
  <button id="reset" type="button">清除所有打勾</button>
</footer>

<script>
var TRIP = [
  { label:"Day 1", date:"11/16（一）", cls:"d1", title:"蘇澳 → 花蓮市區",
    stops:["蘇澳服務區","台泥DAKA園區","好客靚屋","吉安黃昏市場","壽豐小吃","七星潭","東大門夜市","花蓮勝一生魚片"],
    plain:["蘇澳服務區"] },
  { label:"Day 2", date:"11/17（二）", cls:"d2", title:"海岸、湖與文創",
    stops:["太平洋公園","好客靚屋","公正包子","液香扁食","花蓮文創園區","鯉魚潭","花蓮美術館","定置漁場三代目","找到了可頌小売所","星巴克"],
    plain:[] },
  { label:"Day 3", date:"11/18（三）", cls:"d3", title:"縱谷南下與回程",
    stops:["七星潭","好客靚屋","山東豆漿大王","魚塘路落羽松","將軍府1936","玉里","大石鼻山步道","單一純賣雞湯小卷米粉"],
    plain:[] }
];
var KEY = "hualien-trip-done-v1";
var done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { done = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }

var tabs = document.getElementById("tabs");
var days = document.getElementById("days");

TRIP.forEach(function (d, i) {
  var b = document.createElement("button");
  b.type = "button"; b.setAttribute("role", "tab");
  var t = document.createElement("b"); t.textContent = d.label;
  b.appendChild(t); b.appendChild(document.createTextNode(d.date));
  b.addEventListener("click", function () { show(i); });
  tabs.appendChild(b);

  var sec = document.createElement("section");
  sec.className = "day " + d.cls;
  var h = document.createElement("h2"); h.textContent = d.title;
  var m = document.createElement("p"); m.className = "meta";
  m.textContent = d.date + "　共 " + d.stops.length + " 站";
  var ol = document.createElement("ol");
  d.stops.forEach(function (name, j) {
    var id = i + "-" + j;
    var li = document.createElement("li");
    var lab = document.createElement("label");
    var cb = document.createElement("input"); cb.type = "checkbox";
    var sp = document.createElement("span"); sp.textContent = name;
    lab.appendChild(cb); lab.appendChild(sp);
    var a = document.createElement("a");
    var q = d.plain.indexOf(name) >= 0 ? name : "花蓮 " + name;
    a.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
    a.target = "_blank"; a.rel = "noopener"; a.textContent = "地圖";
    a.setAttribute("aria-label", "在地圖開啟 " + name);
    function paint(){ cb.checked = !!done[id]; li.classList.toggle("done", !!done[id]); }
    cb.addEventListener("change", function () {
      if (cb.checked) done[id] = 1; else delete done[id];
      save(); paint();
    });
    paint();
    li.appendChild(lab); li.appendChild(a); ol.appendChild(li);
  });
  sec.appendChild(h); sec.appendChild(m); sec.appendChild(ol);
  days.appendChild(sec);
});

function show(i){
  var bs = tabs.children, ss = days.children;
  for (var k = 0; k < ss.length; k++) {
    ss[k].classList.toggle("on", k === i);
    bs[k].setAttribute("aria-selected", k === i ? "true" : "false");
  }
  document.documentElement.style.setProperty("--accent",
    getComputedStyle(ss[i]).getPropertyValue("--accent"));
  window.scrollTo(0, 0);
}

document.getElementById("reset").addEventListener("click", function () {
  if (!confirm("確定要清除所有打勾嗎？")) return;
  done = {}; save(); location.reload();
});

// 旅行期間自動打開當天
var today = new Date(), start = new Date(2026, 10, 16), idx = 0;
var diff = Math.floor((new Date(today.getFullYear(), today.getMonth(), today.getDate()) - start) / 86400000);
if (diff >= 0 && diff < TRIP.length) idx = diff;
show(idx);
</script>
</body>
</html>
